name: Wolf — tests & playable builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /tmp/wolf-android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot 4.5.1 and export templates
        run: |
          curl -fsSL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
          curl -fsSL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/web_nothreads_release.zip' -d /tmp/templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          cp /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
      - name: Import and test
        run: |
          set -o pipefail
          godot --headless --editor --import --quit 2>&1 | tee /tmp/wolf-import.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|^WARNING:|resources still in use|instances leaked' /tmp/wolf-import.log; then exit 1; fi
          for suite in smoke gameplay_expansion graphics_expansion ui_expansion animal_behavior atlas_expansion ecology_expansion encounter_controls locomotion_expansion living_world landscape_expansion atlas_observation path_expansion animation_expansion main_story main_story_controls story_journey habitat_details animal_detail nature_journeys nature_journey_controls nature_journey_integration action_anchors main_story_first_mission hud_layout pack_interactions first_mission_controller; do
            XDG_DATA_HOME="/tmp/wolf-test-data/$suite" godot --headless --verbose --audio-driver Dummy --script "tests/$suite.gd" 2>&1 | tee "/tmp/wolf-$suite.log"
            if grep -Eq 'SCRIPT ERROR|^ERROR:|^WARNING:|^FAIL:|resources still in use|instances leaked' "/tmp/wolf-$suite.log"; then exit 1; fi
          done
      - name: Configure Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL --retry 3 -o /tmp/sdk.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/sdk.zip -d /tmp/wolf-sdk-unpack
          mv /tmp/wolf-sdk-unpack/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          python3 - <<'PY'
          import os,subprocess
          manager=os.environ['ANDROID_HOME']+'/cmdline-tools/latest/bin/sdkmanager'
          subprocess.run([manager,'--licenses'],input='y\n'*100,text=True,check=True)
          subprocess.run([manager,'platform-tools','build-tools;35.0.1','platforms;android-35'],check=True)
          PY
          python3 - <<'PY'
          import os,pathlib
          config=pathlib.Path.home()/'.config/godot/editor_settings-4.5.tres'
          text=config.read_text()
          values={'export/android/java_sdk_path':os.environ['JAVA_HOME'], 'export/android/android_sdk_path':os.environ['ANDROID_HOME']}
          import re,json
          for name,value in values.items():
              text=re.sub(r'^'+re.escape(name)+r' = .*\n','',text,flags=re.M)
              text+='\n'+name+' = '+json.dumps(value)+'\n'
          config.write_text(text)
          PY
      - name: Export Android and Web
        run: |
          set -o pipefail
          mkdir -p builds/web
          godot --headless --export-debug Android builds/Wolf-0.12.0-debug.apk 2>&1 | tee /tmp/wolf-android-export.log
          godot --headless --export-release Web builds/web/index.html 2>&1 | tee /tmp/wolf-web-export.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:' /tmp/wolf-android-export.log /tmp/wolf-web-export.log; then exit 1; fi
          cd builds
          zip -qr Wolf-0.12.0-web.zip web
          sha256sum Wolf-0.12.0-debug.apk Wolf-0.12.0-web.zip > SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs Wolf-0.12.0-debug.apk > Android-verification.txt
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging Wolf-0.12.0-debug.apk >> Android-verification.txt
          "$ANDROID_HOME/build-tools/35.0.1/zipalign" -c -P 16 4 Wolf-0.12.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Wolf-0.12.0-Android-and-Web
          path: |
            builds/Wolf-0.12.0-debug.apk
            builds/Wolf-0.12.0-web.zip
            builds/SHA256SUMS.txt
            builds/Android-verification.txt
          retention-days: 30
